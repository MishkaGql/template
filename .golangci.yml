version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  build-tags:
    - integration

output:
  formats:
    text:
      path: stdout
      colors: true
  sort-order:
    - file
    - linter

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  whole-files: true


formatters:
    enable:
      - gci
      - gofumpt
    settings:
      gci:
        custom-order: true
        sections:
          - standard
          - default
          - localmodule

      gofumpt:
        extra:
          # группирует переменные в 1 тип
          group-params: true

          # делает из return; - return {переменная}
          clothe-returns: true

          # перенос скобки
          balance-calls: true

    exclusions:
      generated: strict
      paths:
        - api/
        - migrations/
        - gen/

linters:
  default: none
  enable:
    # Security and Bugs
    - govet
    - gosec
    - staticcheck
    - durationcheck

    - ineffassign
    - makezero
    - unused
    - unconvert
    - unparam

    # Readbility
    - asciicheck
    - nolintlint

    # Errors
    - errcheck
    - errorlint
    - nilerr
    - nilnesserr

    # Database
    - rowserrcheck
    - sqlclosecheck

    # Serialization
    - musttag
    - bodyclose

    # Tests
    - thelper

    # Architecture
    - depguard

  exclusions:
    generated: strict
    paths:
      - '(^|/)api/'
      - '(^|/)migrations/'
      - '(^|/)gen/'

  settings:
    errorlint:
      # не предлагает %w вместо %v
      errorf: false

    # имя параметра не обязательно t, b, tb, f
    thelper:
      test:
        name: false
      benchmark:
        name: false
      tb:
        name: false
      fuzz:
        name: false
    staticcheck:
      checks: ["all", "-ST1000", "-ST1020", "-ST1021", "-ST1022"]
    nolintlint:
      # поясняем почему
      require-explanation: true

      # какой конкретно линтер
      require-specific: true

    depguard:
      rules:

        presentation:
          list-mode: lax
          files:
            - "**/internal/core/presentation/{**/,}*.go"
          deny:
            - pkg: github.com/MishkaGql/template/internal/core/infrastructure/
              desc: presentation не знает о infrastructure

            - pkg: github.com/jackc/pgx
              desc: presentation не знает о pgx

        application:
          list-mode: lax
          files:
            - "**/internal/core/application/{**/,}*.go"
          deny:
            - pkg: github.com/MishkaGql/template/internal/core/infrastructure/
              desc: application не знает о infrastructure

            - pkg: github.com/MishkaGql/template/internal/core/presentation/
              desc: application не знает о infrastructure

            - pkg: net/http
              desc: application не знает о http

            - pkg: github.com/jackc/pgx
              desc: application не знает о pgx

        domain:
          list-mode: lax
          files:
            - "**/internal/core/domain/{**/,}*.go"
          deny:
            - pkg: github.com/MishkaGql/template/internal/core/presentation/
              desc: domain не знает о presentation

            - pkg: github.com/MishkaGql/template/internal/core/application/
              desc: domain не знает о application

            - pkg: github.com/MishkaGql/template/internal/core/infrastructure/
              desc: domain не знает о infrastructure


            - pkg: net/http
              desc: domain не знает о http

            - pkg: github.com/jackc/pgx
              desc: domain не знает о pgx

            - pkg: go.opentelemetry.io/otel
              desc: domain не знает о opentelemetry

        infrastructure:
          list-mode: lax
          files:
            - "**/internal/core/infrastructure/{**/,}*.go"
          deny:
            - pkg: github.com/MishkaGql/template/internal/core/presentation/
              desc: infrastructure не должен знать о presentation
